<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Herbie F1</title>
  <link rel="icon" href="/assets/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root { --panel: rgba(12, 14, 20, 0.78); --red: #e10600; --text: #f4f4f6; --dim: #9aa0ab; --purple: #a855f7; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: var(--text);
      font-family: 'Titillium Web', system-ui, sans-serif; }
    canvas#gl { display: block; }
    .panel { position: fixed; background: var(--panel); border-radius: 6px; backdrop-filter: blur(6px); }
    #tower { top: 16px; left: 16px; width: 220px; padding: 6px 0; font-size: 14px; }
    #tower .head { padding: 2px 12px 6px; font-weight: 900; letter-spacing: .08em; border-bottom: 2px solid var(--red); }
    #tower .row { display: grid; grid-template-columns: 24px 6px 1fr auto; gap: 8px; align-items: center; padding: 2px 12px; }
    #tower .row.me { background: rgba(250, 204, 21, .18); }
    #tower .stripe { width: 4px; height: 14px; border-radius: 2px; }
    #tower .gap { color: var(--dim); font-variant-numeric: tabular-nums; }
    #timing { top: 16px; right: 16px; padding: 10px 16px; min-width: 210px; font-variant-numeric: tabular-nums; }
    #timing .big { font-size: 30px; font-weight: 700; line-height: 1; }
    #timing .line { display: flex; justify-content: space-between; gap: 16px; color: var(--dim); font-size: 14px; }
    #timing .line b { color: var(--text); font-weight: 600; }
    #timing .best b { color: var(--purple); }
    #dash { bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 22px; display: flex; gap: 22px; align-items: end; }
    #dash .k { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
    #speed { font-size: 46px; font-weight: 900; line-height: .9; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
    #gear { font-size: 46px; font-weight: 900; line-height: .9; color: #facc15; min-width: 1.2ch; text-align: center; }
    #pos, #lap { font-size: 26px; font-weight: 700; line-height: 1; }
    #rpm { position: absolute; left: 0; right: 0; top: 0; height: 4px; border-radius: 6px 6px 0 0; overflow: hidden; }
    #rpm i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22c55e, #facc15 70%, #e10600); }
    #map { bottom: 16px; right: 16px; }
    #lights { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); display: none; gap: 14px; padding: 14px 18px; background: #111; border-radius: 10px; }
    #lights i { width: 46px; height: 46px; border-radius: 50%; background: #2a2a2a; box-shadow: inset 0 0 0 4px #000; }
    #lights i.on { background: var(--red); box-shadow: 0 0 26px var(--red), inset 0 0 0 4px #000; }
    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(11,13,18,.55), rgba(11,13,18,.92)); text-align: center; padding: 16px; }
    .overlay h1 { font-size: clamp(40px, 8vw, 88px); margin: 0; font-weight: 900; letter-spacing: -.01em; line-height: 1; }
    .overlay h1 span { color: var(--red); }
    .overlay h2 { margin: 6px 0 24px; font-weight: 400; color: var(--dim); }
    .overlay .go { margin-top: 26px; font-size: 22px; font-weight: 700; animation: pulse 1.4s infinite; }
    .keys { display: grid; grid-template-columns: auto auto; gap: 4px 18px; text-align: left; color: var(--dim); font-size: 15px; }
    .keys b { color: var(--text); }
    @keyframes pulse { 50% { opacity: .45; } }
    #results table { border-collapse: collapse; font-size: 18px; min-width: min(420px, 100%); font-variant-numeric: tabular-nums; }
    #results td { padding: 4px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.08); }
    #results tr.me td { color: #facc15; font-weight: 700; }
    #msg { position: fixed; top: 38%; left: 50%; transform: translateX(-50%); font-size: 54px; font-weight: 900; color: #fff;
      text-shadow: 0 4px 24px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity .3s; }
    body.menu .panel, body.menu #lights { display: none !important; }
    #touch { position: fixed; inset: 0; display: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    @media (pointer: coarse) {
      body:not(.menu) #touch { display: block; }
      #map { bottom: auto; top: 128px; width: 160px; height: 160px; }
    }
    #touch button { position: absolute; border: 2px solid rgba(255,255,255,.35); background: rgba(12,14,20,.45); color: #fff;
      font: 700 18px 'Titillium Web', system-ui, sans-serif; letter-spacing: .06em; border-radius: 18px; padding: 0; }
    #touch button.on { background: rgba(255,255,255,.35); }
    #touch [data-ctl=left], #touch [data-ctl=right] { width: 118px; height: 118px; bottom: calc(24px + env(safe-area-inset-bottom)); font-size: 40px; }
    #touch [data-ctl=left] { left: calc(24px + env(safe-area-inset-left)); }
    #touch [data-ctl=right] { left: calc(156px + env(safe-area-inset-left)); }
    #touch [data-ctl=gas] { width: 118px; height: 170px; right: calc(24px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); border-color: #22c55e; }
    #touch [data-ctl=brake] { width: 118px; height: 118px; right: calc(156px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); border-color: var(--red); }
    #touch [data-act] { top: 16px; width: 86px; height: 44px; font-size: 14px; border-radius: 10px; }
    #touch [data-act=cam] { left: calc(50% - 92px); }
    #touch [data-act=reset] { left: calc(50% + 6px); }
    .hidden { display: none !important; }
    @media (max-width: 700px) { #tower { display: none; } #map { display: none; } }
  </style>
</head>
<body class="menu">
  <canvas id="gl"></canvas>

  <div id="tower" class="panel"><div class="head">LAP <span id="towerlap">1/3</span></div><div id="rows"></div></div>
  <div id="timing" class="panel">
    <div class="big" id="cur">0:00.000</div>
    <div class="line"><span>LAST</span><b id="last">–</b></div>
    <div class="line best"><span>BEST</span><b id="best">–</b></div>
  </div>
  <div id="dash" class="panel">
    <div id="rpm"><i></i></div>
    <div><div class="k">Pos</div><div id="pos">6/6</div></div>
    <div><div class="k">Lap</div><div id="lap">1/3</div></div>
    <div><div class="k">km/h</div><div id="speed">0</div></div>
    <div><div class="k">Gear</div><div id="gear">N</div></div>
  </div>
  <canvas id="map" class="panel" width="220" height="220"></canvas>
  <div id="touch">
    <button data-ctl="left" aria-label="Steer left">◀</button>
    <button data-ctl="right" aria-label="Steer right">▶</button>
    <button data-ctl="brake">BRAKE</button>
    <button data-ctl="gas">GAS</button>
    <button data-act="cam">CAMERA</button>
    <button data-act="reset">RESET</button>
  </div>
  <div id="lights"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="msg"></div>

  <div id="menu" class="overlay">
    <h1>HERBIE <span>F1</span></h1>
    <h2 id="title">British Grand Prix · Silverstone</h2>
    <div class="keys">
      <b>↑ / W</b><span>Throttle</span>
      <b>↓ / S</b><span>Brake / reverse</span>
      <b>← → / A D</b><span>Steer</span>
      <b>C</b><span>Change camera</span>
      <b>R</b><span>Reset car to track</span>
      <b>M</b><span>Mute engine</span>
    </div>
    <div class="go">Press ENTER or tap to start</div>
  </div>

  <div id="results" class="overlay hidden">
    <h1>CHEQUERED <span>FLAG</span></h1>
    <h2 id="verdict"></h2>
    <table><tbody id="resrows"></tbody></table>
    <div class="go">Press ENTER or tap to race again</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
